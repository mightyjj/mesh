services:
  api:
    build: ./apps/api

  gateway:
    build: ./apps/gateway
    environment:
      API_URL: http://api:8080
    depends_on:
      - api

  web:
    build:
      context: ./apps/web
      args:
        GATEWAY_URL: http://gateway:8081
    ports:
      - "3000:3000"
    depends_on:
      - gateway
