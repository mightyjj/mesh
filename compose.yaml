services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mesh
      POSTGRES_PASSWORD: mesh
      POSTGRES_USER: mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesh -d mesh"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: ./apps/api/migrations
    environment:
      DATABASE_URL: postgres://mesh:mesh@db:5432/mesh?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgres://mesh:mesh@db:5432/mesh?sslmode=disable
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  gateway:
    build: ./apps/gateway
    environment:
      API_URL: http://api:8080
    depends_on:
      - api

  web:
    build:
      context: ./apps/web
      args:
        GATEWAY_URL: http://gateway:8081
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  postgres_data:
